name: Recover i386 release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing configured release tag
        required: true
        type: string
      original_run:
        description: Completed build run whose only failed job is i386
        required: true
        type: string

permissions:
  contents: write
  actions: read
  packages: write

concurrency:
  group: recover-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ORIGINAL_RUN: ${{ inputs.original_run }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - id: plan
        env:
          EVENT_NAME: workflow_dispatch
          REF_TYPE: tag
          REF_NAME: ${{ inputs.tag }}
          BASE_REF: ''
          PUBLISH_INPUT: 'true'
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          repo=os.environ['GH_REPO']; run_id=os.environ['ORIGINAL_RUN']
          assert run_id.isdigit()
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          allowed={'v1.9.15.7':('43938220247','fe81f3d5afd664bb374a6b33b28ef240eca070cd'),'v1.9.15.7_dev':('43938227141','38324e97ae4b43bfd05e3cf2db63fdf8e00a317e')}
          assert allowed.get(os.environ['RELEASE_TAG'])==(run_id,source)
          config=json.loads(pathlib.Path('.github/distribution.json').read_text())
          matches=[c for c,v in config['versions'].items() if 'v'+v==os.environ['RELEASE_TAG']]
          assert len(matches)==1
          channel=matches[0]; version=config['versions'][channel]
          run=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run_id}']))
          assert run['status']=='completed' and run['conclusion']=='failure'
          assert run['head_sha']==source and run['head_branch']==os.environ['RELEASE_TAG']
          jobs=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run_id}/jobs?per_page=100']))['jobs']
          assert [j['name'] for j in jobs if j['conclusion']=='failure']==['Container '+channel+' i386']
          for name in ['Validate '+channel,'Binaries '+channel]:
              assert any(j['name']==name and j['conclusion']=='success' for j in jobs)
          assert sum(j['name'].startswith('Container '+channel+' ') and j['conclusion']=='success' for j in jobs)==6
          if subprocess.run(['gh','release','view',os.environ['RELEASE_TAG']],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0:
              raise SystemExit('Release already exists; refusing overwrite')
          subprocess.run(['python3','.github/scripts/fork-build.py','plan'],check=True)
          with open(os.environ['GITHUB_ENV'],'a') as out:
              for k,v in {'SOURCE_SHA':source,'CHANNEL':channel,'VERSION':version,'IMAGE_TAG':'dev' if channel=='dev' else version}.items():
                  out.write(k+'='+v+'\n')
          PY
      - uses: actions/download-artifact@v7
        with:
          name: binaries-${{ steps.plan.outputs.channel }}
          run-id: ${{ inputs.original_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
      - uses: actions/download-artifact@v7
        with:
          pattern: platform-${{ steps.plan.outputs.channel }}-*
          run-id: ${{ inputs.original_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: platforms
      - name: Verify reused binary assets before any publication
        working-directory: dist
        run: |
          sha256sum --check SHA256SUMS
          python3 - <<'PYCODE'
          import json,os,pathlib
          data=json.loads(pathlib.Path('build.json').read_text())
          assert data['source_sha']==os.environ['SOURCE_SHA'] and data['distribution']==os.environ['VERSION']
          assert len(data['binaries'])==13
          PYCODE
      # Docker 29.4.2 denies i386 socketcall. 29.4.3 fixes it without
      # disabling seccomp or overriding the container's default entrypoint.
      - uses: docker/setup-docker-action@v5
        with:
          version: v29.4.3
          set-host: true
      - name: Verify the corrected daemon and its default security
        run: |
          test "$(docker version --format '{{.Server.Version}}')" = '29.4.3'
          docker info --format '{{json .SecurityOptions}}' | tee "$RUNNER_TEMP/docker-security.json"
          grep -F seccomp "$RUNNER_TEMP/docker-security.json"
      - uses: actions/setup-go@v7
        with: {go-version: '1.27', cache: false}
      - uses: docker/setup-buildx-action@v3
      - id: recipe
        env:
          DOCKERFILE: docker/Dockerfile
        run: python3 .github/scripts/fork-build.py recipe
      - uses: docker/build-push-action@v6
        with:
          context: source
          file: ${{ steps.recipe.outputs.file }}
          platforms: linux/386
          load: true
          tags: go2rtc-recovery:test
          labels: |
            org.opencontainers.image.source=https://github.com/Wuty-zju/go2rtc
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ env.CHANNEL }}-i386
          cache-to: type=gha,mode=max,scope=${{ env.CHANNEL }}-i386
      - name: Verify original binary identity and default entrypoint API
        run: |
          docker run --rm --network none --entrypoint /usr/local/bin/go2rtc go2rtc-recovery:test -version | tee "$RUNNER_TEMP/version.txt"
          container=$(docker create go2rtc-recovery:test)
          docker cp "$container:/usr/local/bin/go2rtc" "$RUNNER_TEMP/image-go2rtc"
          docker rm "$container"
          go version -m "$RUNNER_TEMP/image-go2rtc" > "$RUNNER_TEMP/buildinfo.txt"
          grep -F "vcs.revision=$SOURCE_SHA" "$RUNNER_TEMP/buildinfo.txt"
          grep -F 'vcs.modified=false' "$RUNNER_TEMP/buildinfo.txt"
          grep -F 'CGO_ENABLED=0' "$RUNNER_TEMP/buildinfo.txt"
          grep -F 'GOOS=linux' "$RUNNER_TEMP/buildinfo.txt"
          grep -F 'GOARCH=386' "$RUNNER_TEMP/buildinfo.txt"
          printf 'api:\n  listen: "127.0.0.1:1984"\nrtsp:\n  listen: ""\nwebrtc:\n  listen: ""\n' > "$RUNNER_TEMP/smoke.yaml"
          container=$(docker run -d --network none -v "$RUNNER_TEMP/smoke.yaml:/config/go2rtc.yaml:ro" go2rtc-recovery:test)
          trap 'docker logs "$container"; docker rm -f "$container"' EXIT
          ready=false
          for attempt in {1..10}; do
            if docker exec "$container" python3 -c 'import json,sys,urllib.request; x=json.load(urllib.request.urlopen("http://127.0.0.1:1984/api",timeout=2)); assert x["revision"]==sys.argv[1][:7]; assert x["version"]==sys.argv[2]; print(json.dumps(x))' "$SOURCE_SHA" "$VERSION" > "$RUNNER_TEMP/api.json"; then
              ready=true; break
            fi
            sleep 1
          done
          test "$ready" = true
          cat "$RUNNER_TEMP/api.json"
          docker stop -t 5 "$container"
          docker rm "$container"
          trap - EXIT
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: pushed
        uses: docker/build-push-action@v6
        with:
          context: source
          file: ${{ steps.recipe.outputs.file }}
          platforms: linux/386
          provenance: false
          outputs: type=image,name=ghcr.io/wuty-zju/go2rtc,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/Wuty-zju/go2rtc
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
      - name: Verify published platform and recover the seven-platform manifests
        env:
          DIGEST: ${{ steps.pushed.outputs.digest }}
        run: |
          image="ghcr.io/wuty-zju/go2rtc@$DIGEST"
          docker run --rm --network none --entrypoint /usr/local/bin/go2rtc "$image" -version > "$RUNNER_TEMP/published-version.txt"
          cmp "$RUNNER_TEMP/version.txt" "$RUNNER_TEMP/published-version.txt"
          container=$(docker create "$image")
          docker cp "$container:/usr/local/bin/go2rtc" "$RUNNER_TEMP/published-go2rtc"
          docker rm "$container"
          cmp "$RUNNER_TEMP/image-go2rtc" "$RUNNER_TEMP/published-go2rtc"
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE']); temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          dest=root/'platforms'/('platform-'+os.environ['CHANNEL']+'-i386'); dest.mkdir(exist_ok=True)
          record=dict(source_sha=os.environ['SOURCE_SHA'],channel=os.environ['CHANNEL'],tag=os.environ['IMAGE_TAG'],target='i386',suffix='',platform='linux/386',digest=os.environ['DIGEST'],version_output=(temp/'version.txt').read_text().strip(),recovered_from_run=os.environ['ORIGINAL_RUN'],docker_version='29.4.3')
          (dest/'identity.json').write_text(json.dumps(record,indent=2)+'\n')
          records=[json.loads(p.read_text()) for p in (root/'platforms').glob('*/identity.json')]
          assert len(records)==7 and {r['target'] for r in records}=={'amd64','i386','armv6','armv7','arm64','hardware-amd64','rockchip-arm64'}
          assert all(r['source_sha']==os.environ['SOURCE_SHA'] and r['channel']==os.environ['CHANNEL'] and r['tag']==os.environ['IMAGE_TAG'] for r in records)
          assert all(os.environ['VERSION'] in r['version_output'] and os.environ['SOURCE_SHA'][:7] in r['version_output'] and '.dirty' not in r['version_output'] for r in records)
          groups={}
          for r in records: groups.setdefault(r['suffix'],[]).append(r)
          assert {k:len(v) for k,v in groups.items()}=={'':5,'-hardware':1,'-rockchip':1}
          manifests=[]
          for suffix,items in groups.items():
              image='ghcr.io/wuty-zju/go2rtc'; tags=[image+':'+os.environ['IMAGE_TAG']+suffix]
              if os.environ['CHANNEL']=='master': tags.extend([image+':latest'+suffix,image+':master'+suffix])
              subprocess.run(['docker','buildx','imagetools','create',*[a for t in tags for a in ['--tag',t]],*[image+'@'+r['digest'] for r in items]],check=True)
              descriptor=json.loads(subprocess.check_output(['docker','buildx','imagetools','inspect',tags[0],'--format','{{json .Manifest}}']))
              manifests.append(dict(tags=tags,digest=descriptor['digest'],source_sha=os.environ['SOURCE_SHA'],platforms=items))
          (root/'dist'/'containers.json').write_text(json.dumps(manifests,indent=2)+'\n')
          PY
      - name: Create the new draft after all platform checks
        run: |
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum containers.json >> SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then exit 1; fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --latest=false \
            --title "$VERSION - $(date -u +%F)" --notes-file ../source/.github/release-notes.md ./*
      - uses: actions/upload-artifact@v7
        with:
          name: recovered-release-${{ env.CHANNEL }}
          path: |
            dist/*
            platforms/*/identity.json
            ${{ runner.temp }}/docker-security.json
            ${{ runner.temp }}/buildinfo.txt
            ${{ runner.temp }}/api.json
